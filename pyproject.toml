[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webiq-vs-bing-voice-poc"
version = "0.1.0"
description = "Azure voice search comparison POC: WebIQ vs Grounding with Bing on Azure Voice Live"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects==2.5.0",
    "azure-ai-voicelive[aiohttp]==1.3.0",
    "azure-identity>=1.25,<2",
    "azure-core-tracing-opentelemetry==1.0.0b13",
    "fastapi>=0.141,<0.142",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "uvicorn>=0.52,<0.53",
    "websockets>=15,<17",
]

[project.optional-dependencies]
azure-tracing = ["azure-monitor-opentelemetry-exporter==1.0.0b57"]

[project.scripts]
voice-poc = "voice_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_poc = ["static/*.html", "static/*.js", "static/*.css"]
